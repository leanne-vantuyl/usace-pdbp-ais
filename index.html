<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROSPECT 763 | Working with the PDBP | PPM CoP · USACE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Mulish:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#C8A84B;--gold-light:#E2C97E;--gold-dim:#8B7235;--army-dark:#1A1F14;--army-mid:#252D1C;--army-green:#3D5229;--army-green-light:#4E6B33;--white:#F5F2EB;--white-dim:#C8C4B8;--accent:#7BA05B;--danger:#C0392B;--warn:#D4A017;--border:rgba(200,168,75,0.2);--border-strong:rgba(200,168,75,0.5);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--army-dark);color:var(--white);font-family:'Mulish',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(61,82,41,0.3) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(37,45,28,0.4) 0%,transparent 60%);pointer-events:none;z-index:0;}

/* HEADER */
header{border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;background:rgba(26,31,20,0.97);backdrop-filter:blur(12px);z-index:200;}
.header-inner{max-width:900px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.logo-block{display:flex;align-items:center;gap:12px;}
.logo-seal{width:36px;height:36px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:11px;color:var(--gold);flex-shrink:0;}
.logo-primary{font-family:'DM Serif Display',serif;font-size:14px;color:var(--white);}
.logo-sub{font-size:9px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-weight:600;}
.course-badge{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold-dim);border:1px solid var(--border);padding:3px 8px;letter-spacing:.1em;}

/* PROGRESS BAR */
.progress-bar-wrap{background:rgba(37,45,28,.8);border-bottom:1px solid var(--border);padding:8px 0;}
.progress-bar-inner{max-width:900px;margin:0 auto;padding:0 24px;}
.progress-track{height:3px;background:rgba(200,168,75,.15);border-radius:2px;margin-bottom:6px;}
.progress-fill{height:3px;background:var(--gold);border-radius:2px;transition:width .4s ease;}
.progress-labels{display:flex;justify-content:space-between;align-items:center;}
.progress-text{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:.08em;}
.progress-pct{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold);font-weight:700;}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:1;}

/* SCREENS */
.screen{display:none;animation:fadeUp .32s ease both;}
.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* WELCOME */
.welcome-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:12px;}
.welcome-title{font-family:'DM Serif Display',serif;font-size:clamp(28px,4vw,46px);line-height:1.15;color:var(--white);margin-bottom:8px;}
.welcome-title em{font-style:italic;color:var(--gold-light);}
.welcome-rule{width:48px;height:2px;background:var(--gold);margin:18px 0;}
.welcome-body{font-size:13px;line-height:1.75;color:var(--white-dim);max-width:600px;margin-bottom:28px;}
.welcome-body strong{color:var(--white);font-weight:600;}
.course-meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:32px;}
.course-meta-card{border:1px solid var(--border);background:rgba(37,45,28,.4);padding:13px 15px;}
.cmc-label{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.cmc-value{font-size:12px;color:var(--white);font-weight:600;}
.objectives-box{background:rgba(37,45,28,.5);border:1px solid var(--border);border-left:3px solid var(--gold-dim);padding:16px 18px;margin-bottom:28px;}
.obj-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
.obj-item{display:flex;gap:8px;margin-bottom:7px;font-size:12px;color:var(--white-dim);line-height:1.5;}
.obj-item::before{content:'→';color:var(--gold-dim);flex-shrink:0;}

/* NAME INPUT */
.name-input-wrap{margin-bottom:24px;}
.name-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:8px;display:block;}
.name-input{background:rgba(37,45,28,.6);border:1px solid var(--border);color:var(--white);font-family:'Mulish',sans-serif;font-size:14px;padding:12px 15px;outline:none;width:100%;max-width:420px;transition:border-color .2s;}
.name-input:focus{border-color:var(--gold-dim);}
.name-input::placeholder{color:var(--white-dim);opacity:.4;}

/* MODULE NAV */
.module-nav{display:flex;gap:4px;margin-bottom:28px;flex-wrap:wrap;}
.mod-btn{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.07em;text-transform:uppercase;padding:6px 12px;background:transparent;border:1px solid var(--border);color:var(--white-dim);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;}
.mod-btn.active{background:var(--gold);border-color:var(--gold);color:var(--army-dark);font-weight:700;}
.mod-btn.complete{border-color:rgba(123,160,91,.5);color:var(--accent);}
.mod-btn.locked{opacity:.3;cursor:not-allowed;}
.mod-check{font-size:9px;}

/* LESSON CONTENT */
.lesson-eyebrow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.lesson-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--white);margin-bottom:16px;line-height:1.2;}
.lesson-body{font-size:13px;line-height:1.8;color:var(--white-dim);margin-bottom:18px;}
.lesson-body strong{color:var(--white);font-weight:600;}
.lesson-body em{color:var(--gold-light);font-style:italic;}
.callout{background:rgba(200,168,75,.07);border:1px solid var(--border);border-left:3px solid var(--gold-dim);padding:13px 16px;margin:16px 0;font-size:12px;color:var(--white-dim);line-height:1.65;}
.callout strong{color:var(--gold-light);}
.callout-label{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
.warn-callout{background:rgba(192,57,43,.07);border:1px solid rgba(192,57,43,.25);border-left:3px solid var(--danger);padding:13px 16px;margin:16px 0;font-size:12px;color:#E07C73;line-height:1.65;}
.proc-tag{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold);border:1px solid var(--border-strong);padding:3px 8px;display:inline-block;margin:3px 3px 3px 0;letter-spacing:.07em;}
.phase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:16px 0;}
.phase-card{border:1px solid var(--border);background:rgba(37,45,28,.4);padding:14px;}
.phase-name{font-family:'DM Serif Display',serif;font-size:14px;color:var(--white);margin-bottom:4px;}
.phase-codes{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold);margin-bottom:6px;}
.phase-desc{font-size:10px;color:var(--white-dim);line-height:1.45;}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px;margin:14px 0;}
.role-card{border:1px solid var(--border);background:rgba(37,45,28,.3);padding:11px 13px;}
.role-title{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:.07em;margin-bottom:4px;}
.role-desc{font-size:10px;color:var(--white-dim);line-height:1.4;}
.lesson-nav{display:flex;align-items:center;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--border);}
.lesson-counter{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold-dim);}

/* KNOWLEDGE CHECK */
.kc-header{background:rgba(37,45,28,.6);border:1px solid var(--border);border-left:3px solid var(--gold);padding:14px 18px;margin-bottom:20px;}
.kc-label{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-bottom:4px;}
.kc-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--white);}
.question-block{background:rgba(26,31,20,.5);border:1px solid var(--border);padding:18px;margin-bottom:12px;}
.question-num{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:.1em;margin-bottom:8px;}
.question-text{font-size:13px;color:var(--white);line-height:1.55;margin-bottom:14px;font-weight:600;}
.answer-option{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--border);margin-bottom:6px;cursor:pointer;transition:all .15s;font-size:12px;color:var(--white-dim);line-height:1.4;}
.answer-option:hover{border-color:var(--gold-dim);color:var(--white);}
.answer-option.selected{border-color:var(--gold);background:rgba(200,168,75,.08);color:var(--white);}
.answer-option.correct{border-color:var(--accent);background:rgba(123,160,91,.1);color:var(--accent);}
.answer-option.incorrect{border-color:var(--danger);background:rgba(192,57,43,.08);color:#E07C73;}
.answer-radio{width:14px;height:14px;border:1.5px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.answer-option.selected .answer-radio{border-color:var(--gold);background:var(--gold);}
.answer-option.correct .answer-radio{border-color:var(--accent);background:var(--accent);}
.answer-option.incorrect .answer-radio{border-color:var(--danger);background:var(--danger);}
.answer-radio-dot{width:6px;height:6px;border-radius:50%;background:var(--army-dark);display:none;}
.answer-option.selected .answer-radio-dot,.answer-option.correct .answer-radio-dot,.answer-option.incorrect .answer-radio-dot{display:block;}
.kc-feedback{padding:12px 15px;margin-top:10px;font-size:12px;border-radius:1px;display:none;}
.kc-feedback.show{display:block;}
.kc-feedback.pass{background:rgba(123,160,91,.1);border:1px solid rgba(123,160,91,.3);color:var(--accent);}
.kc-feedback.fail{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.25);color:#E07C73;}
.kc-score{font-family:'DM Mono',monospace;font-size:24px;font-weight:700;margin-bottom:4px;}
.kc-score.pass{color:var(--accent);}
.kc-score.fail{color:var(--danger);}

/* FINAL ASSESSMENT */
.assessment-intro{background:rgba(37,45,28,.5);border:1px solid var(--border-strong);padding:20px;margin-bottom:24px;text-align:center;}
.assessment-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--white);margin-bottom:8px;}
.assessment-sub{font-size:12px;color:var(--white-dim);line-height:1.6;}
.pass-threshold{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);margin-top:8px;}

/* CERTIFICATE */
.cert-wrap{background:rgba(26,31,20,.3);border:2px solid var(--border-strong);padding:40px;text-align:center;position:relative;margin-top:28px;}
.cert-wrap::before{content:'';position:absolute;inset:8px;border:1px solid var(--border);pointer-events:none;}
.cert-eyebrow{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;}
.cert-seal{width:56px;height:56px;border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:14px;color:var(--gold);margin:0 auto 16px;}
.cert-presents{font-size:12px;color:var(--white-dim);margin-bottom:8px;}
.cert-name{font-family:'DM Serif Display',serif;font-size:clamp(24px,4vw,36px);color:var(--gold-light);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.cert-body{font-size:12px;color:var(--white-dim);line-height:1.7;max-width:500px;margin:12px auto;}
.cert-course{font-family:'DM Serif Display',serif;font-size:20px;color:var(--white);margin:12px 0 4px;}
.cert-course-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold-dim);letter-spacing:.1em;margin-bottom:16px;}
.cert-meta{display:flex;justify-content:center;gap:32px;margin:20px 0;flex-wrap:wrap;}
.cert-meta-item{text-align:center;}
.cert-meta-label{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
.cert-meta-val{font-size:11px;color:var(--white);font-weight:600;}
.cert-sig-line{border-top:1px solid var(--border);width:200px;margin:20px auto 4px;}
.cert-sig-name{font-family:'DM Serif Display',serif;font-size:13px;color:var(--white);}
.cert-sig-title{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:.08em;}
.cert-code{font-family:'DM Mono',monospace;font-size:8px;color:var(--gold-dim);margin-top:16px;opacity:.6;}

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--army-dark);font-family:'Mulish',sans-serif;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:12px 22px;border:none;cursor:pointer;transition:all .2s;}
.btn-primary:hover{background:var(--gold-light);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.btn-secondary{display:inline-flex;align-items:center;gap:7px;background:transparent;color:var(--white-dim);font-family:'Mulish',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:12px 18px;border:1px solid var(--border);cursor:pointer;transition:all .2s;}
.btn-secondary:hover{border-color:var(--border-strong);color:var(--white);}
.btn-ghost{background:transparent;border:none;color:var(--gold-dim);font-size:10px;cursor:pointer;font-family:'Mulish',sans-serif;padding:5px 0;transition:color .2s;}
.btn-ghost:hover{color:var(--gold);}
.btn-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;}

/* RESULT SCREEN */
.result-big{font-family:'DM Serif Display',serif;font-size:48px;margin-bottom:8px;}
.result-big.pass{color:var(--accent);}
.result-big.fail{color:var(--danger);}

footer{border-top:1px solid var(--border);padding:14px 0;margin-top:20px;position:relative;z-index:1;}
.footer-inner{max-width:900px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.footer-attr{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold-dim);letter-spacing:.09em;}
.footer-doc{font-size:9px;color:var(--white-dim);opacity:.4;}

/* LIGHT MODE — ACCESSIBILITY FIRST (audience age 22-75, avg 50+) */
/* Design standard: minimum 7:1 contrast, large text, clear visual separation */
body.light-mode{background:#FFFFFF;color:#111111;font-size:15px;}
body.light-mode{
  --army-dark:#FFFFFF;
  --army-mid:#E8E4D9;
  --white:#111111;
  --white-dim:#222222;
  --gold:#5A4010;
  --gold-light:#3A2A08;
  --gold-dim:#5A4010;
  --border:rgba(90,64,16,0.4);
  --border-strong:rgba(90,64,16,0.7);
  --accent:#1A4A10;
}
body.light-mode::before{display:none;}

/* HEADER */
body.light-mode header{background:#FFFFFF;border-bottom:2px solid #5A4010;}
body.light-mode .logo-primary{color:#111111;font-size:15px;}
body.light-mode .logo-sub{color:#5A4010;}
body.light-mode .course-badge{color:#111111;border:1px solid #5A4010;background:#E8E4D9;}

/* PROGRESS */
body.light-mode .progress-bar-wrap{background:#E8E4D9;border-bottom:2px solid #5A4010;}
body.light-mode .progress-text{color:#111111;font-size:10px;}
body.light-mode .progress-pct{color:#5A4010;}
body.light-mode .progress-track{background:#C8C0A8;}
body.light-mode .progress-fill{background:#5A4010;}

/* WELCOME */
body.light-mode .welcome-eyebrow{color:#5A4010;font-size:11px;letter-spacing:.2em;}
body.light-mode .welcome-title{color:#111111;}
body.light-mode .welcome-rule{background:#5A4010;}
body.light-mode .welcome-body{color:#111111;font-size:14px;line-height:1.9;}

/* COURSE META CARDS — clearly visible boxes */
body.light-mode .course-meta-card{
  background:#E8E4D9;
  border:2px solid #5A4010;
  border-left:5px solid #5A4010;
}
body.light-mode .cmc-label{
  color:#5A4010;
  font-size:9px;
  font-weight:700;
  letter-spacing:.15em;
}
body.light-mode .cmc-value{
  color:#111111;
  font-size:14px;
  font-weight:700;
}

/* OBJECTIVES BOX */
body.light-mode .objectives-box{
  background:#E8E4D9;
  border:2px solid #5A4010;
  border-left:6px solid #5A4010;
}
body.light-mode .obj-label{color:#5A4010;font-size:10px;font-weight:700;}
body.light-mode .obj-item{color:#111111;font-size:13px;line-height:1.7;}
body.light-mode .obj-item::before{color:#5A4010;}

/* NAME INPUT */
body.light-mode .name-label{color:#111111;font-size:10px;font-weight:700;letter-spacing:.12em;}
body.light-mode .name-input{
  background:#FFFFFF;
  border:2px solid #5A4010;
  color:#111111;
  font-size:16px;
}
body.light-mode .name-input:focus{border-color:#111111;border-width:3px;}
body.light-mode .name-input::placeholder{color:#888888;opacity:1;}

/* MODULE NAV BUTTONS */
body.light-mode .mod-btn{
  background:#E8E4D9;
  border:2px solid #5A4010;
  color:#111111;
  font-size:9px;
  font-weight:700;
}
body.light-mode .mod-btn:hover{background:#D4CDB8;border-color:#111111;color:#111111;}
body.light-mode .mod-btn.active{background:#5A4010;border-color:#5A4010;color:#FFFFFF;font-weight:700;}
body.light-mode .mod-btn.complete{background:#E8F0E8;border-color:#1A4A10;color:#1A4A10;font-weight:700;}
body.light-mode .mod-btn.locked{background:#F0EDE8;border-color:#C8C0B0;color:#888888;opacity:.7;}

/* LESSON CONTENT */
body.light-mode .lesson-eyebrow{color:#5A4010;font-size:10px;font-weight:700;}
body.light-mode .lesson-title{color:#111111;font-size:28px;}
body.light-mode .lesson-body{color:#111111;font-size:14px;line-height:1.9;}
body.light-mode .lesson-counter{color:#5A4010;font-size:10px;}

/* CALLOUTS — solid visible backgrounds */
body.light-mode .callout{
  background:#E8E4D9;
  border:1px solid #A08840;
  border-left:6px solid #5A4010;
  color:#111111;
  font-size:13px;
}
body.light-mode .callout-label{color:#5A4010;font-size:9px;font-weight:700;}
body.light-mode .callout strong{color:#111111;font-weight:700;}

/* WARNING CALLOUTS */
body.light-mode .warn-callout{
  background:#FFF0EC;
  border:1px solid #C84830;
  border-left:6px solid #8B1A1A;
  color:#6B0A0A;
  font-size:13px;
}
body.light-mode .warn-callout strong{color:#6B0A0A;font-weight:700;}

/* PROC TAGS */
body.light-mode .proc-tag{
  color:#111111;
  border:2px solid #5A4010;
  background:#E8E4D9;
  font-weight:700;
  font-size:10px;
}

/* PHASE AND ROLE CARDS */
body.light-mode .phase-card{background:#E8E4D9;border:2px solid #5A4010;}
body.light-mode .phase-name{color:#111111;font-size:15px;font-weight:700;}
body.light-mode .phase-codes{color:#5A4010;font-size:9px;font-weight:700;}
body.light-mode .phase-desc{color:#111111;font-size:11px;}
body.light-mode .role-card{background:#E8E4D9;border:2px solid #5A4010;}
body.light-mode .role-title{color:#5A4010;font-size:10px;font-weight:700;}
body.light-mode .role-desc{color:#111111;font-size:11px;}

/* KNOWLEDGE CHECK */
body.light-mode .kc-header{
  background:#E8E4D9;
  border:2px solid #5A4010;
  border-left:6px solid #5A4010;
}
body.light-mode .kc-label{color:#5A4010;font-size:9px;font-weight:700;}
body.light-mode .kc-title{color:#111111;font-size:20px;font-weight:700;}
body.light-mode .question-num{color:#5A4010;font-size:9px;font-weight:700;}
body.light-mode .question-block{
  background:#F8F6F2;
  border:2px solid #C8C0A8;
}
body.light-mode .question-text{
  color:#111111;
  font-size:14px;
  font-weight:700;
  line-height:1.6;
}

/* ANSWER OPTIONS — large, clear, easy to tap */
body.light-mode .answer-option{
  background:#FFFFFF;
  border:2px solid #C8C0A8;
  color:#111111;
  font-size:13px;
  line-height:1.6;
  padding:12px 14px;
}
body.light-mode .answer-option:hover{
  background:#E8E4D9;
  border-color:#5A4010;
  border-width:2px;
  color:#111111;
}
body.light-mode .answer-option.selected{
  background:#E8E4D9;
  border:3px solid #5A4010;

      {
        title:'The Purpose of the PDBP',
        eyebrow:'Module 1 · Lesson 1',
        content:`<p class="lesson-body">The <strong>Project Delivery Business Process (PDBP)</strong> is the United States Army Corps of Engineers' standardized framework for managing the complete lifecycle of every project — from the moment work is accepted through final closeout. It is not optional guidance. It is the doctrine that governs how USACE delivers its mission.</p>
<p class="lesson-body">The PDBP exists because project delivery is inherently complex. Multiple organizations, funding sources, stakeholders, and technical disciplines must coordinate across years or decades to deliver a single project. Without a common framework, every district, every PDT, and every project would invent its own approach — with predictably inconsistent results.</p>
<div class="callout"><div class="callout-label">Key Principle</div>The PDBP creates a <strong>common language and common process</strong> across the entire enterprise. When a PDT in Omaha and a PDT in Savannah follow the same process, USACE leadership can manage performance, identify gaps, and deploy resources consistently.</div>
<p class="lesson-body">The PDBP is built on <strong>Risk-Informed Decision Making (RIDM)</strong> — every major decision in the lifecycle, starting with work acceptance itself, requires evaluation of mission impact, reputational risk, and workforce capacity before a commitment is made.</p>
<p class="lesson-body">The PDBP covers four lifecycle phases — <strong>Initiation, Planning, Execution, and Closeout</strong> — and defines specific business processes within each phase. Each process has defined steps, responsible roles, and required documentation. Nothing is left to interpretation.</p>
<p class="lesson-body">Understanding the PDBP is not just a requirement for Project Managers. <strong>Every member of a Project Delivery Team</strong> has specific responsibilities within the framework. A cost engineer who does not understand PROC2040, or a contracting officer who does not understand PROC2050, creates risk for the entire project.</p>`

<div class="callout"><div class="callout-label">Primary Reference</div><strong>EM 5-1-11 — Project Delivery Business Process</strong><br>The Engineer Manual containing all PDBP process steps, decision trees, role assignments, and required documentation. The August 2024 revision is the current authoritative version. All 15 active PROC codes are verified against this revision.</div>
<div class="callout"><div class="callout-label">Regulatory Authority</div><strong>ER 5-1-11 — Project Delivery Business Process Regulation</strong><br>The Engineer Regulation implementing the requirements of EM 5-1-11. Compliance with ER 5-1-11 is mandatory for all USACE activities.</div>
<p class="lesson-body">The framework also draws on a library of Reference documents — designated with the prefix <strong>REF</strong> followed by a number — that provide detailed guidance for specific planning activities. These include:</p>
<div class="phase-grid">
<div class="phase-card"><div class="phase-name">REF8005G</div><div class="phase-desc">Project Management Plan content requirements</div></div>
<div class="phase-card"><div class="phase-name">REF8007G</div><div class="phase-desc">Risk Management Plan and Risk Register</div></div>
<div class="phase-card"><div class="phase-name">REF8003G</div><div class="phase-desc">Contingency Funds at the project level</div></div>
<div class="phase-card"><div class="phase-name">REF8018G</div><div class="phase-desc">Earned Value Management</div></div>
</div>
<p class="lesson-body">When a process step references a REF document, that document provides the detailed standard the PDT must meet. The EM tells you <em>what</em> to do — the REF tells you <em>how</em> to do it.</p>
<div class="warn-callout"><strong>Important:</strong> The August 2024 revision of EM 5-1-11 made substantive changes to several processes — including a significant change to EVM applicability language in PROC3000. Always verify you are working from the current revision.</div>`

        title:'Why Process Compliance Matters',

        content:`<p class="lesson-body">Process compliance is not bureaucratic formality. Every requirement in EM 5-1-11 exists because projects have failed when that requirement was skipped. The most common — and most costly — project delivery failures in USACE history trace directly to specific process gaps.</p>
<div class="warn-callout"><strong>The most common failure pattern:</strong> A PDT proceeds to the next phase before completing the current one. Work begins before funds are verified. Execution starts before the PMP is approved. Closeout is skipped under schedule pressure. Each shortcut creates compounding risk.</div>
<p class="lesson-body">Compliance also protects individual team members. When a decision is documented, when steps are followed, when approvals are obtained at the right level — the PDT has a defensible record. When shortcuts are taken and documented in an Inspector General finding, individuals are held accountable.</p>
<div class="callout"><div class="callout-label">The Three Compliance Stakes</div>
<strong>Financial:</strong> Anti-Deficiency Act violations, unauthorized commitments, unreconcilable obligations<br><br>

<strong>Reputational:</strong> EIG findings, Congressional notification, stakeholder loss of confidence</div>
<p class="lesson-body">The PDT is the unit of accountability. Every member of the team — regardless of their functional role — shares responsibility for process compliance. Understanding the PDBP is the first step in meeting that responsibility.</p>`

<div class="proc-tag">PROC1000</div><div class="proc-tag">PROC1020</div><div class="proc-tag">PROC1030</div><div class="proc-tag">PROC1040</div>

<div class="callout"><div class="callout-label">PROC3000 — Project Execution and Control</div>Requires three conditions before execution may begin: <strong>(1)</strong> Approved PMP, <strong>(2)</strong> Confirmed funds, <strong>(3)</strong> Fully staffed PDT with named individuals. All three must be verified before notice to proceed is issued. Performance must be monitored monthly at minimum with EVM metrics where required.</div>

      {
        title:'PDT Composition and Roles',

        content:`<p class="lesson-body">The <strong>Project Delivery Team (PDT)</strong> is the unit of accountability for USACE project delivery. It is not an advisory group — it is the team responsible for executing every step of the PDBP on behalf of the command.</p>
<p class="lesson-body">A fully constituted PDT includes the following core roles. All assignments must be <strong>named individuals</strong> — placeholder names or TBD assignments are not acceptable at any stage:</p>
<div class="role-grid">
<div class="role-card"><div class="role-title">Project Manager (PM)</div><div class="role-desc">PM of record. Accountable for all delivery commitments. Primary interface with stakeholders and command.</div></div>

function updateProgress(){
  var total=4;
  var done=Object.values(CS.moduleComplete).filter(Boolean).length;
  var pct=CS.finalPassed?100:Math.round((done/total)*100);
  var fill=document.getElementById('progress-fill');
  var lbl=document.getElementById('progress-label');
  var pctEl=document.getElementById('progress-pct');
  if(fill)fill.style.width=pct+'%';
  if(pctEl)pctEl.textContent=pct+'%';
  if(lbl){
    if(CS.finalPassed)lbl.textContent='Course Complete';
    else lbl.textContent='Module '+CS.currentModule+' of 4';
  }
  // Update mod buttons
  for(var i=1;i<=4;i++){
    var btn=document.getElementById('mod-btn-'+i);
    if(!btn)return;
    btn.className='mod-btn'+(CS.currentModule===i?' active':'')+(CS.moduleComplete[i]?' complete':'')+(i>1&&!CS.moduleComplete[i-1]&&CS.currentModule!==i?' locked':'');
    btn.querySelector('.mod-check').textContent=CS.moduleComplete[i]?'✓':'';
  }
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  var el=document.getElementById(id);
  if(el){el.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
}

  return `<div class="screen active" id="screen-kc">
${renderModuleNav()}
<div class="kc-header">
<div class="kc-label">&#10003; Knowledge Check</div>
<div class="kc-title">${kc.title}</div>
</div>
${qHTML}
<div class="kc-feedback" id="kc-feedback"></div>
<div class="btn-row" id="kc-btn-row">
<button class="btn-primary" id="kc-submit-btn" onclick="submitKC(${modNum})" disabled>Submit Answers</button>
</div>
</div>`;
}

function renderFinalAssessment(){
  finalAnswers={};
  var qHTML=FINAL_QUESTIONS.map(function(q,qi){
    return `<div class="question-block" id="fa-q-${qi}">
<div class="question-num">Question ${qi+1} of ${FINAL_QUESTIONS.length}</div>
<div class="question-text">${q.text}</div>
${q.options.map(function(opt,oi){
  return `<div class="answer-option" id="fa-opt-${qi}-${oi}" onclick="selectFAAnswer(${qi},${oi})">
<div class="answer-radio"><div class="answer-radio-dot"></div></div>
${opt}
</div>`;
}).join('')}
</div>`;
  }).join('');
  return `<div class="screen active" id="screen-final">
<div class="assessment-intro">
<div class="assessment-title">Final Assessment</div>
<div class="assessment-sub">Answer all 20 questions. You must score 80% or higher to receive your certificate of completion.<br>You may retake the assessment if needed.</div>
<div class="pass-threshold">Passing Score: 16 of 20 correct (80%)</div>
</div>
${qHTML}
<div class="btn-row" style="justify-content:center;margin-top:24px;">
<button class="btn-primary" id="fa-submit-btn" onclick="submitFinal()" disabled>Submit Final Assessment</button>
</div>
</div>`;
}

function renderCertificate(){
  var date=new Date(CS.completedAt).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  var code='P763-'+Math.abs(CS.name.split('').reduce(function(a,c){return((a<<5)-a)+c.charCodeAt(0);},0)).toString(16).toUpperCase().slice(0,6)+'-'+new Date(CS.completedAt).getFullYear();
  return `<div class="screen active" id="screen-cert">
<div style="text-align:center;margin-bottom:24px;">
<h2 class="lesson-title" style="color:var(--accent);">&#10003; Course Complete</h2>
<p style="font-size:13px;color:var(--white-dim);">Final Score: ${CS.finalScore}/20 (${Math.round((CS.finalScore/20)*100)}%) &middot; Certificate generated below</p>
</div>
<div class="cert-wrap" id="certificate">
<div class="cert-eyebrow">United States Army Corps of Engineers &middot; PPM Community of Practice</div>
<div class="cert-seal">PPM</div>
<div class="cert-presents">This certifies that</div>
<div class="cert-name">${CS.name}</div>
<div class="cert-body">has successfully completed the requirements of</div>
<div class="cert-course">PROSPECT 763</div>
<div class="cert-course-sub">Working with the PDBP &middot; Self-Paced Online Course &middot; 2 Credit Hours</div>
<div class="cert-body">Verified against EM 5-1-11 (August 2024 Revision) &middot; ER 5-1-11 (31 July 2018)</div>
<div class="cert-meta">
<div class="cert-meta-item"><div class="cert-meta-label">Date Completed</div><div class="cert-meta-val">${date}</div></div>
<div class="cert-meta-item"><div class="cert-meta-label">Final Score</div><div class="cert-meta-val">${CS.finalScore}/20 (${Math.round((CS.finalScore/20)*100)}%)</div></div>
<div class="cert-meta-item"><div class="cert-meta-label">Credit Hours</div><div class="cert-meta-val">2.0</div></div>
</div>
<div class="cert-sig-line"></div>
<div class="cert-sig-name">Leanne Van Tuyl</div>
<div class="cert-sig-title">Lead Instructor, PROSPECT 355 &amp; 402 &middot; PPM CoP Lead &middot; HQ USACE Civil Works</div>
<div class="cert-code">Completion Code: ${code} &middot; PROSPECT 763 v1.0 &middot; PPM Community of Practice</div>
</div>
<div class="btn-row" style="justify-content:center;margin-top:20px;">
<button class="btn-primary" onclick="window.print()">&#128424; Print Certificate</button>
<button class="btn-secondary" onclick="restartCourse()">Retake Course</button>
</div>
</div>`;
}

// ===== INTERACTIONS =====
function startCourse(){
  var name=document.getElementById('name-input').value.trim();
  if(!name){alert('Please enter your name to continue.');return;}
  CS.name=name;
  CS.screen='module';
  CS.currentModule=1;
  CS.currentLesson=0;
  saveState();
  document.getElementById('progress-bar-wrap').style.display='block';
  renderCurrentView();
}

function resumeCourse(){
  document.getElementById('progress-bar-wrap').style.display='block';
  renderCurrentView();
}

function goToModule(num){
  if(num>1&&!CS.moduleComplete[num-1]&&num!==CS.currentModule)return;
  CS.currentModule=num;
  CS.currentLesson=0;
  CS.screen='lesson';
  saveState();
  renderCurrentView();
}

function goToLesson(modNum,lessonIdx){
  CS.currentModule=modNum;
  CS.currentLesson=lessonIdx;
  CS.screen='lesson';
  saveState();
  renderCurrentView();
}

function startKC(modNum){
  CS.screen='kc';
  CS.currentModule=modNum;
  saveState();
  renderCurrentView();
}

function selectKCAnswer(qi,oi,correct,explanation){
  if(currentKCAnswers[qi]!==undefined)return;
  currentKCAnswers[qi]=oi;
  var allAnswered=Object.keys(currentKCAnswers).length===MODULES[CS.currentModule-1].kc.questions.length;
  // Highlight selection
  document.querySelectorAll('[id^="kc-opt-'+qi+'-"]').forEach(function(el){
    el.classList.remove('selected');
  });
  document.getElementById('kc-opt-'+qi+'-'+oi).classList.add('selected');
  if(allAnswered){
    var btn=document.getElementById('kc-submit-btn');
    if(btn)btn.disabled=false;
  }
}

function submitKC(modNum){
  var mod=MODULES[modNum-1];
  var kc=mod.kc;
  var correct=0;
  kc.questions.forEach(function(q,qi){
    var selected=currentKCAnswers[qi];
    if(selected===undefined)return;
    var isCorrect=selected===q.correct;
    if(isCorrect)correct++;
    // Show correct/incorrect
    document.querySelectorAll('[id^="kc-opt-'+qi+'-"]').forEach(function(el){
      el.classList.remove('selected');
    });
    document.getElementById('kc-opt-'+qi+'-'+selected).classList.add(isCorrect?'correct':'incorrect');
    if(!isCorrect){
      document.getElementById('kc-opt-'+qi+'-'+q.correct).classList.add('correct');
    }
  });
  CS.kcScores[modNum]=correct;
  var pct=Math.round((correct/kc.questions.length)*100);
  var passed=pct>=60;
  var fb=document.getElementById('kc-feedback');
  fb.className='kc-feedback show '+(passed?'pass':'fail');
  fb.innerHTML='<div class="kc-score '+(passed?'pass':'fail')+'">'+correct+'/'+kc.questions.length+'</div>'
    +(passed?'<strong>Well done.</strong> You may continue to the next module.':'<strong>Review the material above and try again.</strong> Score 60% or higher to continue.');
  var btnRow=document.getElementById('kc-btn-row');
  if(passed){
    CS.moduleComplete[modNum]=true;
    saveState();
    var nextLabel=modNum<4?'Continue to Module '+(modNum+1)+' &rarr;':'Final Assessment &rarr;';
    var nextFn=modNum<4?'goToModule('+(modNum+1)+')':'startFinal()';
    btnRow.innerHTML='<button class="btn-primary" onclick="'+nextFn+'">'+nextLabel+'</button>';
  } else {
    btnRow.innerHTML='<button class="btn-primary" onclick="retakeKC('+modNum+')">Retake Knowledge Check</button>';
  }
}

function retakeKC(modNum){
  CS.screen='kc';
  saveState();
  renderCurrentView();
}

function startFinal(){
  CS.screen='final';
  saveState();
  renderCurrentView();
}

function selectFAAnswer(qi,oi){
  if(finalAnswers[qi]!==undefined){
    // Allow changing answer
    document.querySelectorAll('[id^="fa-opt-'+qi+'-"]').forEach(function(el){el.classList.remove('selected');});
  }
  finalAnswers[qi]=oi;
  document.getElementById('fa-opt-'+qi+'-'+oi).classList.add('selected');
  var allAnswered=Object.keys(finalAnswers).length===FINAL_QUESTIONS.length;
  var btn=document.getElementById('fa-submit-btn');
  if(btn)btn.disabled=!allAnswered;
}

function submitFinal(){
  var correct=0;
  FINAL_QUESTIONS.forEach(function(q,qi){
    var selected=finalAnswers[qi];
    if(selected===undefined)return;
    var isCorrect=selected===q.correct;
    if(isCorrect)correct++;
    document.querySelectorAll('[id^="fa-opt-'+qi+'-"]').forEach(function(el){el.classList.remove('selected');});
    document.getElementById('fa-opt-'+qi+'-'+selected).classList.add(isCorrect?'correct':'incorrect');
    if(!isCorrect)document.getElementById('fa-opt-'+qi+'-'+q.correct).classList.add('correct');
  });
  CS.finalScore=correct;
  CS.finalPassed=correct>=16;
  if(CS.finalPassed){
    CS.completedAt=new Date().toISOString();
    CS.screen='certificate';
    saveState();
    renderCurrentView();
  } else {
    var pct=Math.round((correct/20)*100);
    var wrap=document.createElement('div');
    wrap.className='assessment-intro';
    wrap.style.marginTop='24px';
    wrap.innerHTML='<div class="result-big fail">'+correct+'/20</div>'
      +'<div class="assessment-sub">Score: '+pct+'% &mdash; You need 80% (16/20) to pass.<br>Review the highlighted answers above, then retake when ready.</div>';
    var btnRow=document.querySelector('[id="fa-submit-btn"]').parentElement;
    btnRow.innerHTML='';
    btnRow.appendChild(wrap);
    var retakeBtn=document.createElement('button');
    retakeBtn.className='btn-primary';
    retakeBtn.style.marginTop='16px';
    retakeBtn.textContent='Retake Assessment';
    retakeBtn.onclick=function(){CS.screen='final';saveState();renderCurrentView();};
    btnRow.appendChild(retakeBtn);
  }
}

function restartCourse(){
  if(confirm('This will clear all course progress and start over. Continue?')){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

function renderCurrentView(){
  var main=document.getElementById('main-content');
  if(CS.screen==='certificate'){
    main.innerHTML=renderCertificate();
  } else if(CS.screen==='final'){
    main.innerHTML=renderFinalAssessment();
  } else if(CS.screen==='kc'){
    main.innerHTML=renderKC(CS.currentModule);
  } else {
    main.innerHTML=renderLesson(CS.currentModule,CS.currentLesson);
  }
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== THEME TOGGLE =====
// Default is LIGHT MODE — dark is the toggle option
function toggleTheme(){
  var isDark=document.body.classList.toggle('light-mode');
  var btn=document.getElementById('theme-toggle');
  // classList.toggle returns true if class was ADDED (light), false if removed (dark)
  if(isDark){
    if(btn)btn.innerHTML='&#9790; Dark';
    localStorage.setItem('p763-theme','light');
  } else {
    if(btn)btn.innerHTML='&#9788; Light';
    localStorage.setItem('p763-theme','dark');
  }
}
(function restoreTheme(){
  var saved=localStorage.getItem('p763-theme');
  // Default is light — only switch to dark if explicitly saved as dark
  if(saved==='dark'){
    document.body.classList.remove('light-mode');
    document.addEventListener('DOMContentLoaded',function(){
      var btn=document.getElementById('theme-toggle');
      if(btn)btn.innerHTML='&#9788; Light';
    });
  }
  // If saved==='light' or no preference, light mode is already active via body class
})();

// ===== INIT =====
(function init(){
  var main=document.getElementById('main-content');
  main.innerHTML=renderWelcome();
  var saved=loadState();
  if(saved&&CS.name&&CS.screen!=='welcome'){
    // Pre-fill name
    var inp=document.getElementById('name-input');
    if(inp)inp.value=CS.name;
  }
})();
</script>
</body>
